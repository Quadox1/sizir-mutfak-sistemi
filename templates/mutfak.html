<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sızır Alabalık — Mutfak Ekranı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { background-color: #12121e; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .order-card { background-color: #1e1e2e; border: 3px solid #313244; border-radius: 16px; transition: all 0.3s ease; position: relative; }
        .order-card.ready-all { border-color: #a6e3a1 !important; box-shadow: 0 0 15px rgba(166, 227, 161, 0.2); }
        .order-card.muted-completed { opacity: 0.35; border-color: #45475a !important; background-color: #181825 !important; filter: grayscale(80%); }
        .item-btn { text-align: left; font-size: 1.35rem !important; font-weight: 700 !important; padding: 14px 18px; border-radius: 12px; }
        .item-btn.hazirlaniyor { background-color: #2a2a3c; color: #ffffff; border: 2px solid #45475a; }
        .item-btn.hazir { background-color: #1e3a2b; color: #a6e3a1; text-decoration: line-through; border: 2px solid #a6e3a1; }
        .badge-garson-lg { font-size: 1.2rem !important; font-weight: 800 !important; padding: 6px 12px; background-color: #89b4fa; color: #11111b; border-radius: 8px; }
        .order-no-lg { font-size: 2.2rem !important; font-weight: 900; color: #f9e2af; }
        .btn-delete-card { position: absolute; top: -12px; left: -12px; width: 34px; height: 34px; border-radius: 50%; padding: 0; font-weight: bold; z-index: 10; }
    </style>
</head>
<body class="p-3">

<div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
    <h2 class="text-warning fw-bold m-0">🍳 Sızır Mutfak & Fırın Ekranı</h2>
    <button class="btn btn-danger btn-lg fs-5 fw-bold px-4" onclick="clearAllScreen()">
        🧹 Ekranı Komple Temizle
    </button>
</div>

<div class="row g-4" id="orders-container"></div>

<script>
    const socket = io();
    const alertAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    let allOrders = [];

    const MENU_ORDER = [
        "Izgara Balık",
        "Sivas Köfte",
        "Tavuk Kanat",
        "Kiremitte Balık",
        "Kaşarlı Balık",
        "Köz Tabağı"
    ];

    socket.on('tum_siparisler', (orders) => {
        allOrders = orders;
        renderAllCards();
    });

    socket.on('yeni_siparis', (order) => {
        try { alertAudio.play(); } catch(e){}
        allOrders.push(order);
        renderAllCards();
    });

    socket.on('siparis_guncellendi', (order) => {
        let idx = allOrders.findIndex(o => o.order_id === order.order_id);
        if (idx !== -1) allOrders[idx] = order;
        else allOrders.push(order);
        renderAllCards();
    });

    socket.on('siparis_silindi', (data) => {
        allOrders = allOrders.filter(o => o.order_id !== data.order_id);
        renderAllCards();
    });

    function clearAllScreen() {
        allOrders = [];
        renderAllCards();
    }

    function renderAllCards() {
        const container = document.getElementById('orders-container');
        container.innerHTML = '';

        if (allOrders.length === 0) {
            container.innerHTML = '<div class="col-12 text-center text-secondary my-5 fs-3">Ekranda bekleyen sipariş bulunmuyor.</div>';
            return;
        }

        let sorted = [...allOrders].sort((a, b) => {
            if (a.status === 'mutfak_tamam' && b.status !== 'mutfak_tamam') return 1;
            if (a.status !== 'mutfak_tamam' && b.status === 'mutfak_tamam') return -1;
            return b.order_id - a.order_id;
        });

        sorted.forEach(order => {
            container.appendChild(createOrderCardElement(order));
        });
    }

    function createOrderCardElement(order) {
        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-lg-4 col-xl-3';
        col.id = `card-${order.order_id}`;

        let isCompleted = (order.status === 'mutfak_tamam');

        let sortedItems = [...order.items].sort((a, b) => {
            let idxA = MENU_ORDER.indexOf(a.name);
            let idxB = MENU_ORDER.indexOf(b.name);
            return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
        });

        let itemsHtml = sortedItems.map(item => {
            let mStatus = item.mutfak_status || item.status || 'hazirlaniyor';
            let isGarsonTook = (item.garson_status === 'alindi');

            return `
                <button class="btn w-100 item-btn mb-2 d-flex justify-content-between align-items-center ${mStatus}" 
                        ${isCompleted ? 'disabled' : ''}
                        onclick="toggleItemStatus('${order.order_id}', '${item.id}')">
                    <span>
                        <strong class="text-warning me-2 fs-3">${item.qty}x</strong> ${item.name}
                        ${isGarsonTook ? '<span class="badge bg-warning text-dark fs-6 ms-2">🏃 Garson Aldı</span>' : ''}
                    </span>
                    <span class="fs-3">${mStatus === 'hazir' ? '✅' : '⏳'}</span>
                </button>
            `;
        }).join('');

        col.innerHTML = `
            <div class="order-card p-3 ${isCompleted ? 'muted-completed' : ''}">
                <button class="btn btn-danger btn-delete-card" onclick="deleteOrderCard('${order.order_id}')" title="Siparişi Sil">✕</button>

                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-2">
                    <span class="order-no-lg">#${order.order_id}</span>
                    <div class="text-end">
                        <span class="badge-garson-lg d-block mb-1">👤 ${order.garson}</span>
                        <span class="text-secondary fw-bold fs-6">🕒 ${order.time}</span>
                    </div>
                </div>

                ${itemsHtml}

                ${isCompleted ? `
                    <button class="btn btn-outline-warning btn-sm w-100 mt-2 fw-bold" onclick="siparisGeriAl('${order.order_id}')">
                        ↩️ Geri Al (Aktif Yap)
                    </button>
                ` : ''}
            </div>
        `;
        return col;
    }

    function toggleItemStatus(orderId, itemId) {
        fetch('/api/mutfak/item-durum', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId, item_id: itemId })
        });
    }

    function deleteOrderCard(orderId) {
        fetch('/api/siparis-sil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId })
        });
    }

    function siparisGeriAl(orderId) {
        fetch('/api/siparis-geri-al', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId })
        });
    }
</script>
</body>
</html>
