<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sızır Alabalık — Mutfak Ekranı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { background-color: #12121e; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .order-card { background-color: #1e1e2e; border: 2px solid #313244; border-radius: 14px; }
        .order-card.ready-all { border-color: #a6e3a1 !important; }
        .item-btn { text-align: left; font-size: 1.15rem; font-weight: 600; padding: 12px 16px; border-radius: 10px; }
        .item-btn.hazirlaniyor { background-color: #2a2a3c; color: #cdd6f4; border: 1px solid #45475a; }
        .item-btn.hazir { background-color: #2e4438; color: #a6e3a1; text-decoration: line-through; border: 1px solid #a6e3a1; }
    </style>
</head>
<body class="p-3">

<h3 class="text-warning fw-bold mb-4">🍳 Sızır Mutfak & Fırın Ekranı</h3>
<div class="row g-3" id="orders-container"></div>

<script>
    const socket = io();
    const alertAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    socket.on('tum_siparisler', (orders) => {
        document.getElementById('orders-container').innerHTML = '';
        orders.forEach(order => renderOrderCard(order));
    });

    socket.on('yeni_siparis', (order) => {
        try { alertAudio.play(); } catch(e){}
        renderOrderCard(order);
    });

    socket.on('siparis_guncellendi', (order) => {
        const card = document.getElementById(`card-${order.order_id}`);
        if (card) card.replaceWith(createOrderCardElement(order));
    });

    socket.on('siparis_silindi', (data) => {
        const card = document.getElementById(`card-${data.order_id}`);
        if (card) card.remove();
    });

    function renderOrderCard(order) {
        document.getElementById('orders-container').prepend(createOrderCardElement(order));
    }

    function createOrderCardElement(order) {
        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-lg-4 col-xl-3';
        col.id = `card-${order.order_id}`;

        let isAllReady = order.items.every(i => i.status === 'hazir');
        let itemsHtml = order.items.map(item => `
            <button class="btn w-100 item-btn mb-2 d-flex justify-content-between align-items-center ${item.status}" 
                    onclick="toggleItemStatus('${order.order_id}', '${item.id}')">
                <span><strong class="text-warning me-1">${item.qty}x</strong> ${item.name}</span>
                <span>${item.status === 'hazir' ? '✅' : '⏳'}</span>
            </button>
        `).join('');

        col.innerHTML = `
            <div class="order-card p-3 ${isAllReady ? 'ready-all' : ''}">
                <div class="d-flex justify-content-between mb-2">
                    <span class="fs-4 fw-bold text-warning">#${order.order_id}</span>
                    <span class="badge bg-primary fs-6">${order.garson}</span>
                </div>
                ${itemsHtml}
                <button class="btn btn-danger btn-sm w-100 mt-2 py-2 fw-bold" onclick="deleteOrder('${order.order_id}')">
                    🗑️ Siparişi Tamamla
                </button>
            </div>
        `;
        return col;
    }

    function toggleItemStatus(orderId, itemId) {
        fetch('/api/item-durum-degistir', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId, item_id: itemId })
        });
    }

    // ONAY KUTUSU SİLİNDİ, DİREKT SİLER
    function deleteOrder(orderId) {
        fetch('/api/siparis-sil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId })
        });
    }
</script>
</body>
</html>
