<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mutfak Ekranı (KDS) — Sızır Alabalık</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { background-color: #0f0f15; color: #fff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .order-card { background-color: #1a1a24; border: 2px solid #2d2d3f; border-radius: 12px; transition: all 0.3s ease; }
        .order-card.ready { border-color: #198754; opacity: 0.6; }
        .order-header { background-color: #252538; border-bottom: 1px solid #333; padding: 10px 15px; border-radius: 10px 10px 0 0; }
        .item-btn { text-align: left; font-size: 1.1rem; padding: 12px; border-radius: 8px; transition: 0.2s; }
        .item-btn.hazirlaniyor { background-color: #2b2b3d; color: #fff; border: 1px solid #444; }
        .item-btn.hazir { background-color: #198754; color: #fff; text-decoration: line-through; border-color: #198754; }
    </style>
</head>
<body class="p-3">

<header class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary">
    <h2 class="text-warning fw-bold m-0">🍳 Sızır Mutfak & Fırın Takip Paneli</h2>
    <span class="badge bg-success fs-6" id="connection-status">🟢 Canlı Bağlantı</span>
</header>

<div class="row g-3" id="orders-container">
    <!-- Sipariş Kartları Buraya Dinamik Düşecek -->
</div>

<script>
    const socket = io();
    const alertAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'); // Zil sesi

    socket.on('tum_siparisler', (orders) => {
        const container = document.getElementById('orders-container');
        container.innerHTML = '';
        orders.forEach(order => renderOrderCard(order));
    });

    socket.on('yeni_siparis', (order) => {
        try { alertAudio.play(); } catch(e){}
        renderOrderCard(order);
    });

    socket.on('siparis_guncellendi', (order) => {
        const existingCard = document.getElementById(`card-${order.order_id}`);
        if (existingCard) {
            existingCard.replaceWith(createOrderCardElement(order));
        }
    });

    socket.on('siparis_silindi', (data) => {
        const card = document.getElementById(`card-${data.order_id}`);
        if (card) card.remove();
    });

    function renderOrderCard(order) {
        const container = document.getElementById('orders-container');
        const cardEl = createOrderCardElement(order);
        container.prepend(cardEl);
    }

    function createOrderCardElement(order) {
        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-lg-4 col-xl-3';
        col.id = `card-${order.order_id}`;

        let isAllReady = order.items.every(i => i.status === 'hazir');

        let itemsHtml = order.items.map(item => `
            <button class="btn w-100 item-btn mb-2 d-flex justify-content-between align-items-center ${item.status}" 
                    onclick="toggleItemStatus('${order.order_id}', '${item.id}')">
                <span><strong>${item.qty}x</strong> ${item.name}</span>
                <span>${item.status === 'hazir' ? '✅' : '⏳'}</span>
            </button>
        `).join('');

        col.innerHTML = `
            <div class="order-card ${isAllReady ? 'ready' : ''}">
                <div class="order-header d-flex justify-content-between align-items-center">
                    <div>
                        <span class="fs-4 fw-bold text-warning">#${order.order_id}</span>
                        <span class="badge bg-primary ms-2 fs-6">👤 ${order.garson}</span>
                    </div>
                    <span class="text-secondary small">🕒 ${order.time}</span>
                </div>
                <div class="p-3">
                    ${itemsHtml}
                    <button class="btn btn-outline-danger btn-sm w-100 mt-2" onclick="deleteOrder('${order.order_id}')">🗑️ Siparişi Kapat</button>
                </div>
            </div>
        `;
        return col;
    }

    function toggleItemStatus(orderId, itemId) {
        fetch('/api/item-durum-degistir', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId, item_id: itemId })
        });
    }

    function deleteOrder(orderId) {
        if (confirm("Bu sipariş kartını ekrandan kaldırmak istediğinize emin misiniz?")) {
            fetch('/api/siparis-sil', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId })
            });
        }
    }
</script>
</body>
</html>
