<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garson Sipariş Girişi — Sızır Alabalık</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 12px; }
        .btn-garson { border-radius: 20px; font-weight: bold; }
        .qty-btn { width: 38px; height: 38px; font-weight: bold; border-radius: 50%; }
        .basket-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: #1e1e1e; border-top: 2px solid #333; padding: 12px 20px; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="pb-5 mb-5">

<div class="container py-3">
    <!-- Garson Seçim Alanı -->
    <div class="card card-custom p-3 mb-3">
        <label class="form-label text-warning font-weight-bold fw-bold">👤 Garson Adı Seçin:</label>
        <div class="d-flex flex-wrap gap-2" id="garson-buttons">
            {% for g in garsonlar %}
            <button class="btn btn-outline-warning btn-garson px-3 py-2" onclick="selectGarson('{{ g }}', this)">{{ g }}</button>
            {% endfor %}
        </div>
    </div>

    <!-- Menü Kategorileri ve Ürünler -->
    {% for cat, items in menu.items() %}
    <div class="card card-custom p-3 mb-3">
        <h5 class="text-info fw-bold mb-3">{{ cat }}</h5>
        <div class="row g-2">
            {% for item in items %}
            <div class="col-12 d-flex justify-content-between align-items-center bg-dark p-2 rounded border border-secondary">
                <span class="fw-bold">{{ item }}</span>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-danger qty-btn p-0" onclick="updateQty('{{ item }}', -1)">-</button>
                    <span id="qty-{{ item }}" class="fw-bold text-warning fs-5 px-1">0</span>
                    <button class="btn btn-success qty-btn p-0" onclick="updateQty('{{ item }}', 1)">+</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>

<!-- Alt Sipariş Onay Barı -->
<div class="basket-bar d-flex justify-content-between align-items-center">
    <div>
        <span class="text-secondary small d-block">Seçilen Garson: <strong id="lbl-garson" class="text-warning">Seçilmedi</strong></span>
        <span class="fw-bold text-white fs-5" id="lbl-total-items">0 Ürün</span>
    </div>
    <button class="btn btn-success btn-lg px-4 fw-bold" id="btn-submit" onclick="submitOrder()" disabled>🚀 Mutfağa Gönder</button>
</div>

<script>
    let selectedGarson = "";
    let basket = {};

    function selectGarson(name, btn) {
        selectedGarson = name;
        document.querySelectorAll('#garson-buttons button').forEach(b => b.classList.replace('btn-warning', 'btn-outline-warning'));
        btn.classList.replace('btn-outline-warning', 'btn-warning');
        document.getElementById('lbl-garson').innerText = name;
        checkCanSubmit();
    }

    function updateQty(item, change) {
        if (!basket[item]) basket[item] = 0;
        basket[item] = Math.max(0, basket[item] + change);
        document.getElementById(`qty-${item}`).innerText = basket[item];
        if (basket[item] === 0) delete basket[item];
        
        let totalCount = Object.values(basket).reduce((a, b) => a + b, 0);
        document.getElementById('lbl-total-items').innerText = `${totalCount} Ürün`;
        checkCanSubmit();
    }

    function checkCanSubmit() {
        let totalCount = Object.values(basket).reduce((a, b) => a + b, 0);
        document.getElementById('btn-submit').disabled = !(selectedGarson && totalCount > 0);
    }

    function submitOrder() {
        if (!selectedGarson) return alert("Lütfen Garson seçin!");

        let itemsPayload = [];
        for (let [name, qty] of Object.entries(basket)) {
            itemsPayload.push({ name: name, qty: qty });
        }

        fetch('/api/siparis-ver', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ garson: selectedGarson, items: itemsPayload })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                alert(`✅ Sipariş #${data.order_id} Mutfağa İletildi!`);
                // Sepeti Sıfırla
                basket = {};
                document.querySelectorAll('[id^="qty-"]').forEach(el => el.innerText = '0');
                document.getElementById('lbl-total-items').innerText = '0 Ürün';
                checkCanSubmit();
            }
        });
    }
</script>
</body>
</html>
