<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sızır Alabalık — Garson Hesabı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { background-color: #12121e; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .card-dark { background-color: #1e1e2e; border: 1px solid #313244; border-radius: 12px; }
        .text-accent { color: #89b4fa; }
        .qty-btn { width: 48px; height: 48px; font-weight: bold; font-size: 1.5rem; border-radius: 8px; }
        .basket-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: #181825; border-top: 2px solid #89b4fa; padding: 12px 16px; z-index: 1000; }
        .item-row { background-color: #2a2a3c; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid #45475a; }
        .order-badge { background-color: #2a2a3c; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px solid #45475a; }
        .order-badge.ready-notify { border: 3px solid #a6e3a1 !important; background-color: #1c2b22 !important; }
        .order-badge.garson-took-badge { border: 2px solid #f9e2af !important; background-color: #2b281d !important; }
        .item-text-lg { color: #ffffff !important; font-weight: 700; font-size: 1.25rem; }
    </style>
</head>
<body class="pb-5 mb-5">

<!-- GİRİŞ EKRANI -->
<div id="login-screen" class="position-fixed top-0 start-0 w-100 h-100 bg-dark d-flex align-items-center justify-content-center p-3" style="z-index: 2000;">
    <div class="card card-dark p-4 w-100" style="max-width: 380px;">
        <h3 class="text-center text-accent fw-bold mb-2">🐟 Sızır Alabalık</h3>
        <p class="text-secondary text-center small mb-4">Garson Girişi</p>
        <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">Kullanıcı Adı</label>
            <input type="text" id="input-username" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Örn: ahmet">
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">Şifre</label>
            <input type="password" id="input-password" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="••••">
        </div>
        <button type="button" id="btn-login-action" class="btn btn-primary btn-lg w-100 fw-bold">Giriş Yap</button>
    </div>
</div>

<!-- MAIN EKRAN -->
<div class="container py-3" id="app-content" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-3 card-dark p-3">
        <div>
            <span class="text-secondary small d-block">Aktif Garson</span>
            <h3 class="text-warning fw-bold m-0" id="garson-title">---</h3>
        </div>
        <button type="button" class="btn btn-outline-danger btn-sm fw-bold" id="btn-logout">Çıkış Yap</button>
    </div>

    <!-- Menü -->
    <div class="card card-dark p-3 mb-3">
        <h5 class="text-warning fw-bold mb-3">🍽️ Menü</h5>
        {% for item in menu %}
        <div class="item-row d-flex justify-content-between align-items-center">
            <span class="fw-bold fs-5 text-white">{{ item }}</span>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-danger qty-btn p-0 d-flex align-items-center justify-content-center" onclick="updateQty('{{ item }}', -1)">-</button>
                <span id="qty-{{ item }}" class="fw-bold text-warning fs-4 px-2">0</span>
                <button type="button" class="btn btn-success qty-btn p-0 d-flex align-items-center justify-content-center" onclick="updateQty('{{ item }}', 1)">+</button>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Mutfaktaki Siparişleriniz -->
    <div class="card card-dark p-3 mb-5">
        <h5 class="text-info fw-bold mb-3">⏳ Sipariş Takibi & Bildirimler</h5>
        <div id="my-orders-list">
            <p class="text-secondary small">Henüz siparişiniz yok.</p>
        </div>
    </div>
</div>

<div class="basket-bar d-flex justify-content-between align-items-center" id="basket-bar" style="display: none !important;">
    <div>
        <span class="text-secondary small d-block">Toplam Seçilen</span>
        <span class="fw-bold text-white fs-4" id="lbl-total-items">0 Ürün</span>
    </div>
    <button type="button" class="btn btn-success btn-lg px-4 fw-bold fs-5" id="btn-submit" onclick="submitOrder()" disabled>🚀 Mutfağa Gönder</button>
</div>

<script>
    let activeGarson = localStorage.getItem('sizir_garson_name') || "";
    let basket = {};
    let myOrders = [];
    const socket = io();
    const readyAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('btn-login-action').addEventListener('click', loginGarson);
        document.getElementById('btn-logout').addEventListener('click', logoutGarson);
        if (activeGarson) initGarsonSession();
    });

    function loginGarson() {
        const usernameVal = document.getElementById('input-username').value.trim();
        const passwordVal = document.getElementById('input-password').value.trim();
        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usernameVal, password: passwordVal })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                activeGarson = data.garson_name;
                localStorage.setItem('sizir_garson_name', activeGarson);
                initGarsonSession();
            } else {
                alert(data.message);
            }
        });
    }

    function logoutGarson() {
        localStorage.removeItem('sizir_garson_name');
        location.reload();
    }

    function initGarsonSession() {
        document.getElementById('login-screen').setAttribute('style', 'display: none !important');
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('basket-bar').style.setProperty('display', 'flex', 'important');
        document.getElementById('garson-title').innerText = activeGarson;
    }

    function updateQty(item, change) {
        if (!basket[item]) basket[item] = 0;
        basket[item] = Math.max(0, basket[item] + change);
        document.getElementById(`qty-${item}`).innerText = basket[item];
        if (basket[item] === 0) delete basket[item];

        let totalCount = Object.values(basket).reduce((a, b) => a + b, 0);
        document.getElementById('lbl-total-items').innerText = `${totalCount} Ürün`;
        document.getElementById('btn-submit').disabled = totalCount === 0;
    }

    function submitOrder() {
        let itemsPayload = [];
        for (let [name, qty] of Object.entries(basket)) {
            itemsPayload.push({ name: name, qty: qty });
        }
        fetch('/api/siparis-ver', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ garson: activeGarson, items: itemsPayload })
        }).then(() => {
            basket = {};
            document.querySelectorAll('[id^="qty-"]').forEach(el => el.innerText = '0');
            document.getElementById('lbl-total-items').innerText = '0 Ürün';
            document.getElementById('btn-submit').disabled = true;
        });
    }

    socket.on('tum_siparisler', (orders) => {
        myOrders = orders.filter(o => o.garson === activeGarson);
        renderMyOrders();
    });

    socket.on('yeni_siparis', (order) => {
        if (order.garson === activeGarson) {
            myOrders.push(order);
            renderMyOrders();
        }
    });

    socket.on('siparis_guncellendi', (order) => {
        if (order.garson === activeGarson) {
            let hasReadyItem = order.items.some(i => i.status === 'hazir');
            if (hasReadyItem && order.status !== 'garson_alindi') {
                try { readyAudio.play(); } catch(e){}
            }
            let idx = myOrders.findIndex(o => o.order_id === order.order_id);
            if (idx !== -1) myOrders[idx] = order;
            else myOrders.push(order);
            renderMyOrders();
        }
    });

    function teslimAldim(orderId) {
        fetch('/api/garson-teslim-aldi', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId })
        });
    }

    function geriAlGarson(orderId) {
        fetch('/api/siparis-geri-al', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId, target_status: 'aktif' })
        });
    }

    function renderMyOrders() {
        const container = document.getElementById('my-orders-list');
        if (myOrders.length === 0) {
            container.innerHTML = '<p class="text-secondary small">Henüz siparişiniz yok.</p>';
            return;
        }

        container.innerHTML = myOrders.map(o => {
            let isGarsonTook = (o.status === 'garson_alindi');
            let isMutfakDone = (o.status === 'mutfak_tamam');
            let hasReadyItem = o.items.some(i => i.status === 'hazir');

            let itemsHtml = o.items.map(i => `
                <div class="d-flex justify-content-between border-bottom border-secondary py-2">
                    <span class="item-text-lg">${i.qty}x ${i.name}</span>
                    <span class="${i.status === 'hazir' ? 'text-success fw-bold fs-5' : 'text-warning fw-bold fs-5'}">
                        ${i.status === 'hazir' ? '✅ HAZIR' : '⏳ Hazırlanıyor'}
                    </span>
                </div>
            `).join('');

            return `
                <div class="order-badge ${hasReadyItem && !isGarsonTook ? 'ready-notify' : ''} ${isGarsonTook ? 'garson-took-badge' : ''}">
                    <div class="d-flex justify-content-between fw-bold text-warning mb-2 fs-5">
                        <span>Sipariş #${o.order_id}</span>
                        <span class="text-light">${o.time}</span>
                    </div>

                    ${itemsHtml}

                    <div class="mt-3">
                        ${!isGarsonTook ? `
                            <button class="btn btn-warning btn-lg w-100 py-2 fw-bold fs-5" onclick="teslimAldim('${o.order_id}')">
                                🏃 Siparişi Mutfaktan Teslim Aldım
                            </button>
                        ` : `
                            <div class="d-flex justify-content-between align-items-center bg-dark p-2 rounded border border-warning">
                                <span class="text-success fw-bold">✅ Mutfaktan Alındı</span>
                                <button class="btn btn-outline-secondary btn-sm fw-bold" onclick="geriAlGarson('${o.order_id}')">
                                    ↩️ Geri Al
                                </button>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }).join('');
    }
</script>
</body>
</html>
